name: Build MONSTERKERNEL (moonbeam + MultiSU + ReSuKiSU)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      NDK_VERSION: android-ndk-r25b
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
      ANDROID_API_LEVEL: "21"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/moonbeam_gale_kernel-modified-by-JONNYGHX-
          ref: mb-mglru
          path: kernel/source

      - name: Checkout AnyKernel3 template
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AK3

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves zip unzip \
            git wget ca-certificates gnupg curl libyaml-dev device-tree-compiler
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu || true

      - name: Download and extract Android NDK
        run: |
          wget -qO ndk.zip "${NDK_URL}"
          unzip -q ndk.zip -d toolchain
          rm ndk.zip
          NDK_BIN="${GITHUB_WORKSPACE}/toolchain/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> $GITHUB_PATH
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "CLANG_DRIVER=${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV

      - name: Intégrer MultiSU
        working-directory: kernel/source
        run: curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/legacy/kernel/setup.sh" | bash

      # NOUVELLE ÉTAPE : Utilisation du ZIP local (plus d'erreur réseau 128 !)
      - name: Intégrer ReSuKiSU depuis le dépôt local
        working-directory: kernel/source
        run: |
          unzip -q ReSuKiSU-main.zip
          cp -r ReSuKiSU-main/* .
          echo "ReSuKiSU intégré avec succès depuis le fichier local"

      # EMPÊCHE LA COMPILATION DE DTC (Cause des erreurs précédentes)
      - name: Bypass local DTC compilation
        working-directory: kernel/source
        run: |
          mkdir -p scripts/dtc
          touch scripts/dtc/dtc
          chmod +x scripts/dtc/dtc

      # CORRECTION DU HOOK KPROBES
      - name: Neutraliser les hooks KPROBES non-GKI
        working-directory: kernel/source
        run: |
          sed -i 's/$(error -- KernelSU-Next: No hooks were defined.*)/# Hooks bypassed/' drivers/kernelsu/Kbuild || true
          sed -i '142s/ifdef CONFIG_KPROBES/if 0/' drivers/kernelsu/Kbuild || echo "Ligne 142 non modifiée"

      - name: Activer les flags requis
        working-directory: kernel/source
        run: |
          DEFCONFIG=arch/arm64/configs/gale_defconfig
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=y/' "$DEFCONFIG" || true
          grep -q '^CONFIG_KSU=y' "$DEFCONFIG" || echo 'CONFIG_KSU=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_KPM=y' "$DEFCONFIG" || echo 'CONFIG_KPM=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_TCP_CONG_BBR=y' "$DEFCONFIG" || echo 'CONFIG_TCP_CONG_BBR=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_NET_SCH_FQ=y' "$DEFCONFIG" || echo 'CONFIG_NET_SCH_FQ=y' >> "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          grep -q '^CONFIG_RESUKISU=y' "$DEFCONFIG" || echo 'CONFIG_RESUKISU=y' >> "$DEFCONFIG"

      - name: Configure environment variables for NDK build
        working-directory: kernel/source
        run: |
          echo "HOSTCC=gcc" >> $GITHUB_ENV
          echo "HOSTCXX=g++" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV

      - name: Compile kernel
        working-directory: kernel/source
        run: |
          set -euo pipefail
          export ARCH=arm64 SUBARCH=arm64
          make O=out gale_defconfig 2>&1 | tee defconfig.log
          make O=out HOSTCC=gcc HOSTCXX=g++ CC="$CC" LD="$LD" LLVM=1 DTC=dtc CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" -j$(nproc) 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build_rc

      - name: Vérifier Image.gz-dtb
        run: |
          if [ ! -f kernel/source/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb introuvable, build invalide"
            exit 1
          fi

      - name: Vérifier activation ReSuKiSU
        run: |
          grep CONFIG_RESUKISU kernel/source/out/.config || echo "CONFIG_RESUKISU absent du .config"

      - name: Package with real AnyKernel3
        run: |
          cp kernel/source/out/arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb
          cd AK3
          sed -i "s/device\.name1=.*/device.name1=gale/" anykernel.sh
          sed -i "s/device\.name2=.*/device.name2=gust/" anykernel.sh
          sed -i "s/BLOCK=[^;]*/BLOCK=\/dev\/block\/by-name\/boot/" anykernel.sh
          sed -i "s/IS_SLOT_DEVICE=[0-9]/IS_SLOT_DEVICE=1/" anykernel.sh
          sed -i "s/kernel\.string=.*/kernel.string=MONSTERKERNEL by JONNYGHX/" anykernel.sh
          rm -rf .git
          zip -r9 ../MONSTERKERNEL-flashable.zip .
          cd ..

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel/source/*.log
            kernel/source/out/*.log
            kernel/source/build_rc

      - name: Upload out directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: kernel/source/out

      - name: Upload flashable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MONSTERKERNEL-flashable
          path: MONSTERKERNEL-flashable.zip
