name: Build MONSTERKERNEL (moonbeam + ReSukiSU)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      NDK_VERSION: android-ndk-r25b
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
      ANDROID_API_LEVEL: "21"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: dope226/moonbeam_gale_kernel-modified-by-JONNYGHX-
          ref: mb-mglru
          path: kernel/source

      - name: Checkout AnyKernel3 template
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AK3

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves zip unzip \
            git wget ca-certificates gnupg curl libyaml-dev device-tree-compiler
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu || true

      - name: Download and extract Android NDK
        run: |
          wget -qO ndk.zip "${NDK_URL}"
          unzip -q ndk.zip -d toolchain
          rm ndk.zip
          NDK_BIN="${GITHUB_WORKSPACE}/toolchain/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> $GITHUB_PATH

      - name: Intégrer ReSukiSU (dernière version)
        working-directory: kernel/source
        run: curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Activer Manual Hook (compatible non-GKI)
        working-directory: kernel/source
        run: |
          DEFCONFIG=arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$DEFCONFIG" || echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$DEFCONFIG"

      - name: Appliquer les hooks ReSukiSU manquants
        working-directory: kernel/source
        run: |
          python3 - <<'PYEOF'
          def insert_hook(filepath, extern_decl, func_anchor, body_anchor, hook_call, label):
              with open(filepath) as f:
                  content = f.read()
              idx = content.find(func_anchor)
              if idx == -1:
                  print(f"ERREUR [{label}]: signature de fonction introuvable dans {filepath}")
                  return
              content = content[:idx] + extern_decl + content[idx:]
              idx2 = content.find(func_anchor)
              func_end = content.find('\n}', idx2) + 2
              func_body = content[idx2:func_end]
              if body_anchor not in func_body:
                  print(f"ERREUR [{label}]: ligne d'ancrage introuvable dans le corps ({filepath})")
                  return
              func_body_new = func_body.replace(body_anchor, hook_call + '\n\t' + body_anchor, 1)
              content = content[:idx2] + func_body_new + content[func_end:]
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"[{label}] patché avec succès")

          # execveat (fs/exec.c) - déjà confirmé bon, reconduit tel quel
          insert_hook(
              'fs/exec.c',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n',
              'int do_execve(struct filename *filename,',
              'return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);',
              '#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif',
              'execveat'
          )

          # faccessat (fs/open.c)
          insert_hook(
              'fs/open.c',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n',
              'long do_faccessat(int dfd, const char __user *filename, int mode)',
              'unsigned int lookup_flags = LOOKUP_FOLLOW;',
              '#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif',
              'faccessat'
          )

          # vfs_read (fs/read_write.c)
          insert_hook(
              'fs/read_write.c',
              '#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\n',
              'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)',
              'if (!(file->f_mode & FMODE_READ))',
              '#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif',
              'vfs_read'
          )

          # vfs_fstatat (fs/stat.c) - variante utilisée quand vfs_statx n'existe pas (cas probable en 4.19)
          insert_hook(
              'fs/stat.c',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n',
              'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat, int flag)',
              'if ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT | AT_EMPTY_PATH)) != 0)',
              '#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif',
              'vfs_fstatat'
          )
          PYEOF
          echo "--- Vérification des 4 hooks ---" | tee hooks_verify.log
          grep -rn "ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_vfs_read\|ksu_handle_stat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c | tee -a hooks_verify.log

      - name: Activer les flags requis
        working-directory: kernel/source
        run: |
          DEFCONFIG=arch/arm64/configs/gale_defconfig
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=y/' "$DEFCONFIG" || true
          grep -q '^CONFIG_KSU=y' "$DEFCONFIG" || echo 'CONFIG_KSU=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_KPM=y' "$DEFCONFIG" || echo 'CONFIG_KPM=y' >> "$DEFCONFIG"
          sed -i 's/^# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' "$DEFCONFIG" || true
          sed -i 's/^# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' "$DEFCONFIG" || true
          grep -q '^CONFIG_TCP_CONG_BBR=y' "$DEFCONFIG" || echo 'CONFIG_TCP_CONG_BBR=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_NET_SCH_FQ=y' "$DEFCONFIG" || echo 'CONFIG_NET_SCH_FQ=y' >> "$DEFCONFIG"
          sed -i '/^CONFIG_DEFAULT_TCP_CONG=/d' "$DEFCONFIG" || true
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG" || true
          echo 'CONFIG_LOCALVERSION="-MONSTERKERNEL"' >> "$DEFCONFIG"

      - name: Configure environment variables for NDK build
        working-directory: kernel/source
        run: |
          echo "CC=aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "HOSTCC=gcc" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV

      - name: Compile kernel
        working-directory: kernel/source
        run: |
          set -euo pipefail
          export ARCH=arm64 SUBARCH=arm64 LLVM=1
          make O=out gale_defconfig 2>&1 | tee defconfig.log
          make O=out CC="$CC" LD="$LD" LLVM=1 CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" -j$(nproc) 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build_rc

      - name: Vérifier Image.gz-dtb et activation KSU
        run: |
          if [ ! -f kernel/source/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb introuvable, build invalide"
            exit 1
          fi
          grep '^CONFIG_KSU=y' kernel/source/out/.config || echo "ATTENTION: CONFIG_KSU absent du .config final"
          grep '^CONFIG_KSU_MANUAL_HOOK=y' kernel/source/out/.config || echo "ATTENTION: CONFIG_KSU_MANUAL_HOOK absent du .config final"

      - name: Package with real AnyKernel3
        run: |
          cp kernel/source/out/arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb
          cd AK3
          sed -i "s/device\.name1=.*/device.name1=gale/" anykernel.sh
          sed -i "s/device\.name2=.*/device.name2=gust/" anykernel.sh
          sed -i "s/BLOCK=[^;]*/BLOCK=\/dev\/block\/by-name\/boot/" anykernel.sh
          sed -i "s/IS_SLOT_DEVICE=[0-9]/IS_SLOT_DEVICE=1/" anykernel.sh
          sed -i "s/kernel\.string=.*/kernel.string=MONSTERKERNEL by JONNYGHX/" anykernel.sh
          rm -rf .git
          zip -r9 ../MONSTERKERNEL-flashable.zip .
          cd ..

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: kernel/source/*.log

      - name: Upload flashable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MONSTERKERNEL-flashable
          path: MONSTERKERNEL-flashable.zip
